name: 🌐 Deploy Landing Page to VPS (Nginx)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload site to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          source: "index.html"
          target: "/tmp/personal_page_landing_build"
          rm: true

      - name: Activate site on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            set -e

            sudo mkdir -p /var/www/personal-page-valenzuela-juan
            sudo rm -rf /var/www/personal-page-valenzuela-juan/*
            sudo cp -r /tmp/personal_page_landing_build/* /var/www/personal-page-valenzuela-juan/

            sudo chown -R www-data:www-data /var/www/personal-page-valenzuela-juan

            sudo nginx -t
            sudo systemctl reload nginx